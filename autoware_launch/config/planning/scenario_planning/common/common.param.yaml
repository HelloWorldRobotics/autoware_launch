/**:
  ros__parameters:
    max_vel: 4.17           # max velocity limit [m/s]

    # constraints param for normal driving
    normal:
      min_acc: -0.1         # min deceleration [m/ss]
      max_acc: 1.0          # max acceleration [m/ss]
      min_jerk: -0.25        # min jerk [m/sss]
      max_jerk: 2.5         # max jerk [m/sss]

    # constraints to be observed
    limit:
      min_acc: -0.2         # min deceleration limit [m/ss]
      max_acc: 1.0          # max acceleration limit [m/ss]
      min_jerk: -0.25        # min jerk limit [m/sss]
      max_jerk: 2.0         # max jerk limit [m/sss]
